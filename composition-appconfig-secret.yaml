apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: composition-appconfig-local
spec:
  compositeTypeRef:
    apiVersion: miempresa.io/v1alpha1
    kind: xAppConfig
  mode: Pipeline
  pipeline:
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      # Recurso 1: ConfigMap existente
      - name: configmap-app
        base:
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          spec:
            providerConfigRef:
              name: default
            forProvider:
              manifest:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: config-app-desplregada
                  namespace: default
                data:
                  app_name: "MiAppCorporativa"
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.entorno
          toFieldPath: spec.forProvider.manifest.data.entorno
        - type: FromCompositeFieldPath
          fromFieldPath: spec.puerto
          toFieldPath: spec.forProvider.manifest.data.puerto
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%d"

      # Recurso 2: Secret de Credenciales Sensibles
      - name: secret-app
        base:
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          spec:
            providerConfigRef:
              name: default
            forProvider:
              manifest:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: secret-credenciales-app
                  namespace: default
                type: Opaque
                stringData:
                  db_password: "PasswordSuperSegura2026!"
                  api_key: "key-live-9988776655"
        # Exportamos estos campos como datos de conexión del Composite Resource
        connectionDetails:
        - name: db_password
          type: FromFieldPath
          fromFieldPath: spec.forProvider.manifest.stringData.db_password
        - name: api_key
          type: FromFieldPath
          fromFieldPath: spec.forProvider.manifest.stringData.api_key